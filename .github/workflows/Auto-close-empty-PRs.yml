name: Auto-close empty PRs

permissions:
  issues: write
  pull-requests: write

on:
  pull_request_target:
    # Only check PR description on opened, reopened, and ready_for_review
    types:
      - opened
      - reopened
      - ready_for_review

jobs:
  check-pr:
    name: Close PRs with empty or short descriptions
    runs-on: ubuntu-latest
    # Skip draft PRs until author marks them ready
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Close PR when description is empty or too short
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Strip whitespace and HTML comments to avoid empty descriptions that only contain comments
            const description = (pr.body || '')
              .replace(/<!--[\s\S]*?-->/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();

            const descriptionLength = Array.from(description).length;
            core.info(`Description length: ${descriptionLength}`);

            // Descriptions longer than 8 characters are considered acceptable
            if (descriptionLength > 8) {
              core.info('Description is long enough. No action needed.');
              return;
            }

            // Description is empty or too short, post a comment and auto-close PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                'This PR has been automatically closed because the description is empty or too short.',
                '',
                'Please provide details on what was changed and why, then reopen or submit a new PR.',
              ].join('\n'),
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed',
            });
